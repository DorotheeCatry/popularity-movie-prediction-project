{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-slate-800 p-8 rounded-xl shadow-lg">
        <div>
            <h2 class="text-3xl font-bold text-white mb-6">Reset Password</h2>
            <p class="text-gray-300 mb-6">Enter your email address and we'll send you a link to reset your password.</p>
        </div>
        
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            <div>
                <label for="email" class="text-sm font-medium text-gray-300">Email address</label>
                <input type="email" 
                       name="email" 
                       id="email"
                       required
                       class="mt-1 appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-700 bg-slate-900 text-gray-300 placeholder-gray-500 focus:outline-none focus:ring-red-500 focus:border-red-500 focus:z-10 sm:text-sm">
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                    Send Reset Link
                </button>
            </div>

            <div class="text-center">
                <a href="{% url 'login' %}" class="font-medium text-red-500 hover:text-red-400">
                    Back to login
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
