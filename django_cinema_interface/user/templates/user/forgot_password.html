{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-slate-800 p-8 rounded-xl shadow-lg">
        <div>
            <div class="flex justify-center mb-6">
                <div class="h-16 w-16 bg-red-500/20 rounded-full flex items-center justify-center">
                    <i data-lucide="help-circle" class="h-8 w-8 text-red-500"></i>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-white mb-6 text-center">Réinitialisation du mot de passe</h2>
            <p class="text-gray-300 mb-6">Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
        </div>
        
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            <div>
                <label for="email" class="text-sm font-medium text-gray-300 flex items-center">
                    <i data-lucide="mail" class="h-4 w-4 mr-2"></i>
                    Adresse email
                </label>
                <div class="mt-1 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="at-sign" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="email" 
                           name="email" 
                           id="email"
                           required
                           class="pl-10 appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-700 bg-slate-900 text-gray-300 placeholder-gray-500 focus:outline-none focus:ring-red-500 focus:border-red-500 focus:z-10 sm:text-sm"
                           placeholder="Entrez votre adresse email">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i data-lucide="send" class="h-5 w-5 text-red-300 group-hover:text-white"></i>
                    </span>
                    Envoyer le lien de réinitialisation
                </button>
            </div>

            <div class="text-center">
                <a href="{% url 'login' %}" class="font-medium text-red-500 hover:text-red-400 flex items-center justify-center">
                    <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i>
                    Retour à la connexion
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
