{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-gray-900/50 p-8 rounded-xl shadow-lg border border-[#bae6fd]/20">
        <div>
            <div class="flex justify-center mb-6">
                <div class="h-16 w-16 bg-[#e11d48]/20 rounded-full flex items-center justify-center">
                    <i data-lucide="help-circle" class="h-8 w-8 text-[#e11d48]"></i>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-[#FBFEF9] mb-6 text-center">Réinitialisation du mot de passe</h2>
            <p class="text-[#bae6fd] mb-6">Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
        </div>
        
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            <div>
                <label for="email" class="text-sm font-medium text-[#bae6fd] flex items-center">
                    <i data-lucide="mail" class="h-4 w-4 mr-2"></i>
                    Adresse email
                </label>
                <div class="mt-1 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="at-sign" class="h-5 w-5 text-[#bae6fd]"></i>
                    </div>
                    <input type="email" 
                           name="email" 
                           id="email"
                           required
                           class="pl-10 appearance-none rounded-md relative block w-full px-3 py-2 border border-[#bae6fd]/30 bg-gray-900 text-[#FBFEF9] placeholder-[#bae6fd]/50 focus:outline-none focus:ring-[#e11d48] focus:border-[#e11d48] focus:z-10 sm:text-sm"
                           placeholder="Entrez votre adresse email">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-[#FBFEF9] bg-[#e11d48] hover:bg-[#e11d48]/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#e11d48]">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i data-lucide="send" class="h-5 w-5 text-[#FBFEF9]/80 group-hover:text-[#FBFEF9]"></i>
                    </span>
                    Envoyer le lien de réinitialisation
                </button>
            </div>

            <div class="text-center">
                <a href="{% url 'login' %}" class="font-medium text-[#e11d48] hover:text-[#e11d48]/80 flex items-center justify-center">
                    <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i>
                    Retour à la connexion
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
