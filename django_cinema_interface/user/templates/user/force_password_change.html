{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-slate-800 p-8 rounded-xl shadow-lg">
        <div>
            <h2 class="text-3xl font-bold text-white mb-6">Change Your Password</h2>
            <p class="text-gray-300 mb-6">Please change your temporary password to continue.</p>
        </div>
        
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="space-y-1">
                <label for="{{ field.id_for_label }}" class="text-sm font-medium text-gray-300">
                    {{ field.label }}
                </label>
                <input type="password" 
                       name="{{ field.name }}" 
                       id="{{ field.id_for_label }}"
                       class="mt-1 block w-full rounded-md border border-slate-700 bg-slate-900 text-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500 sm:text-sm"
                       required>
                {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                    Change Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
