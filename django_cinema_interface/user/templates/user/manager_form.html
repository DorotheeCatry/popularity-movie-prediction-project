{% extends "base.html" %}

{% block content %}
<div class="bg-slate-800 rounded-lg shadow-lg p-6">
    <h1 class="text-2xl font-bold text-white mb-6">{% if form.instance.pk %}Edit{% else %}Add{% endif %} Manager</h1>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="space-y-1">
            <label for="{{ field.id_for_label }}" class="text-sm font-medium text-gray-300">
                {{ field.label }}
            </label>
            <input type="{{ field.field.widget.input_type }}" 
                   name="{{ field.name }}" 
                   id="{{ field.id_for_label }}"
                   {% if field.value %}value="{{ field.value }}"{% endif %}
                   class="mt-1 block w-full rounded-md border border-slate-700 bg-slate-900 text-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500 sm:text-sm"
                   {% if field.field.required %}required{% endif %}>
            {% if field.errors %}
            <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="flex justify-end space-x-4">
            <a href="{% url 'manager_list' %}" class="bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-600 transition-colors">
                Cancel
            </a>
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors">
                {% if form.instance.pk %}Update{% else %}Create{% endif %} Manager
            </button>
        </div>
    </form>
</div>
{% endblock %}
