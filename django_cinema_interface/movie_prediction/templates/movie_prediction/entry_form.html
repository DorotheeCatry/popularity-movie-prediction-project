{% extends "base.html" %}

{% block content %}
<div class="bg-gray-900/50 rounded-lg shadow-lg p-6 border border-[#7F95D1]/20">
    <h1 class="text-2xl font-bold text-[#FBFEF9] mb-6 flex items-center">
        <i data-lucide="ticket-plus" class="h-6 w-6 mr-2 text-[#A63446]"></i>
        Ajouter une entrée
    </h1>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="space-y-1">
            <label for="{{ field.id_for_label }}" class="text-sm font-medium text-[#7F95D1] flex items-center">
                <i data-lucide="{% if field.name == 'date' %}calendar{% elif field.name == 'room' %}door{% else %}users{% endif %}" class="h-4 w-4 mr-2"></i>
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <p class="text-[#A63446] text-xs mt-1 flex items-center">
                <i data-lucide="alert-circle" class="h-4 w-4 mr-1"></i>
                {{ field.errors.0 }}
            </p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="flex justify-end space-x-4">
            <a href="{% url 'movie_prediction:entry_list' %}" 
               class="bg-gray-900 text-[#FBFEF9] px-4 py-2 rounded-lg hover:bg-gray-900/70 transition-colors flex items-center border border-[#7F95D1]/20">
                <i data-lucide="x" class="h-4 w-4 mr-2"></i>
                Annuler
            </a>
            <button type="submit" 
                    class="bg-[#A63446] text-[#FBFEF9] px-4 py-2 rounded-lg hover:bg-[#A63446]/90 transition-colors flex items-center">
                <i data-lucide="save" class="h-4 w-4 mr-2"></i>
                Enregistrer
            </button>
        </div>
    </form>
</div>
{% endblock %}
